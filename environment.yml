# Pinned environment: reproduces the stored XGBoost outputs exactly (Windows 11, Python 3.13.9).
# (The corresponding author's machine has xgboost 3.2.0 and scikit-learn 1.7.2; the pins below were verified.)
# PyTorch 2.12.0 (CPU) is the version used for the stored LSTM outputs; see the README
# for which LSTM results are retrained on each run.
name: ml-drought-modeling-studies
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.3.4
  - pandas=2.3.3
  - scipy=1.17.0
  - scikit-learn=1.7.1
  - xgboost=3.1.3
  - shap=0.51.0
  - matplotlib=3.10.7
  - seaborn=0.13.2
  - pillow=12.0.0
  - plotly=6.4.0
  - ipywidgets=8.1.8
  - geopandas=1.1.1
  - shapely=2.1.2
  - pyproj=3.7.2
  - pyogrio=0.12.1
  - jupyterlab
  - ipykernel
  - nbclient
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.12.0
