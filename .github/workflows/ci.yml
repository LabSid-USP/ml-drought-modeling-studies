name: ci

on:
  push:
  pull_request:

jobs:
  figures:
    # The paper figures are drawn only from the versioned article_*.csv files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install numpy==2.3.4 pandas==2.3.3 matplotlib==3.10.7 pillow==12.0.0
      - run: python Previsao/Scripts/article_figures.py --out build/figures
      - uses: actions/upload-artifact@v7
        with:
          name: figures
          path: build/figures

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: >
          pip install --extra-index-url https://download.pytorch.org/whl/cpu
          torch==2.12.0 numpy==2.3.4 pandas==2.3.3 scipy==1.17.0
          scikit-learn==1.7.1 xgboost==3.1.3 shap==0.51.0 matplotlib==3.10.7
          seaborn==0.13.2 pillow==12.0.0 plotly==6.4.0 ipywidgets==8.1.8
      - run: python -c "from Previsao.Scripts import *; from Previsao.Scripts.LSTM import *; print('imports OK')"
